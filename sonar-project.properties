# SonarQube Cloud project configuration.
# Project/organization bound via https://sonarcloud.io — see .sonarlint/connectedMode.json
# for the local IDE connected-mode config that mirrors these keys.
sonar.projectKey=egarcia74_body-of-evidence
sonar.organization=egarcia74

sonar.sources=scripts
sonar.tests=tests
sonar.python.version=3.11

# Cobertura-format coverage report produced by `pytest --cov=scripts
# --cov-report=xml` (see .github/workflows/sonarcloud.yml and
# validate-schema.yml). No minimum coverage threshold is enforced yet —
# see DECISIONS.md.
sonar.python.coverage.reportPaths=coverage.xml

# Fixtures contain deliberately invalid/broken data (that's the point of
# fixtures/invalid/*) and generated example content — not scannable source.
sonar.exclusions=fixtures/**,examples/**
