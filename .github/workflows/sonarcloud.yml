name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarQube Cloud scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets aren't available to PRs from forks, NOR to Dependabot-triggered
    # pull_request runs (GitHub treats those like fork PRs for secret access
    # even though they're same-repo) — skip both rather than fail on a
    # missing SONAR_TOKEN. Lint/Validate/CodeRabbit still run on these PRs;
    # only the Sonar scan is skipped.
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      # All actions pinned to full commit SHAs per GitHub secure-use
      # guidance (the `# vX.Y.Z` comments record the tag each SHA matches).
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Coverage must be generated in this job (not validate-schema.yml,
      # a separate workflow run) so coverage.xml exists on disk when the
      # scan step below reads sonar.python.coverage.reportPaths.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run unit tests with coverage
        run: python -m pytest tests/ -v --cov=scripts --cov-report=xml --cov-report=term-missing

      # Informational only during pre-alpha baselining: the scan reports to
      # SonarQube Cloud without failing CI on the quality gate. To promote
      # the gate to a hard check once the baseline is clean, set
      # `sonar.qualitygate.wait=true` in sonar-project.properties (the
      # separate sonarqube-quality-gate-action is not supported for Cloud).
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
