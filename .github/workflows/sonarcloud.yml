name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarQube Cloud scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets aren't available to PRs from forks, NOR to Dependabot-triggered
    # pull_request runs (GitHub treats those like fork PRs for secret access
    # even though they're same-repo) — skip both rather than fail on a
    # missing SONAR_TOKEN. Lint/Validate/CodeRabbit still run on these PRs;
    # only the Sonar scan is skipped.
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      # All actions pinned to full commit SHAs per GitHub secure-use
      # guidance (the `# vX.Y.Z` comments record the tag each SHA matches).
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402 # v4.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Informational only during pre-alpha baselining: report the quality
      # gate result without failing CI. Promote this to a required branch
      # protection check once the first scan's baseline is clean.
      - name: Quality gate status (informational)
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
