name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-yaml:
    name: Lint YAML files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # TODO: pin actions to full commit SHAs before first tagged release
      - name: Checkout repository
        uses: actions/checkout@v4

      # Uses the repository's .yamllint policy — see that file for the
      # deliberate rule scoping rationale
      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Uses the repository's .markdownlint.jsonc policy — see that file
      # for the deliberate rule scoping rationale
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

  whitespace:
    name: Whitespace hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for whitespace errors
        run: git diff --check HEAD~1 HEAD || (echo "Trailing whitespace or space-before-tab introduced" && exit 1)
