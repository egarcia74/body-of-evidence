name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validation suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # TODO: pin actions to full commit SHAs before first tagged release
      # (GitHub secure-use guidance). Tags used during pre-alpha.
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Validator self-test (valid fixtures must pass, invalid must fail)
        run: python scripts/validate.py --self-test --allow-empty

      - name: Validate investigations
        # --allow-empty is TEMPORARY: no investigations exist yet in pre-alpha.
        # Remove it when the first investigation package lands so that CI
        # fails loudly if investigation data ever silently disappears.
        run: python scripts/validate.py --allow-empty --verbose
