name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validation suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Validator self-test (valid fixtures must pass, invalid must fail)
        run: python scripts/validate.py --self-test --allow-empty

      - name: Validate investigations
        # --allow-empty is TEMPORARY: no investigations exist yet in pre-alpha.
        # Remove it when the first investigation package lands so that CI
        # fails loudly if investigation data ever silently disappears.
        run: python scripts/validate.py --allow-empty --verbose
