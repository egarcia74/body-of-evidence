name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validation suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run unit tests
        # COVERAGE_PROCESS_START + PYTHONPATH enable subprocess coverage
        # (see .coveragerc and .github/coverage-subprocess/sitecustomize.py)
        # so the CLI-level tests, which spawn `python scripts/validate.py`
        # as a fresh interpreter, are actually measured — without this,
        # validate.py reports 0% despite having dedicated CLI tests.
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
          PYTHONPATH: ${{ github.workspace }}/.github/coverage-subprocess
        run: python -m pytest tests/ -v --cov=scripts --cov-report=xml --cov-report=term-missing

      # A silently-missing or empty coverage.xml would let SonarCloud's
      # (separate workflow) scan carry on as if coverage ran when it
      # didn't — make report generation an explicit, checked contract
      # instead of an assumption. A plain existence/size check, not an XML
      # parse: this file is our own CI-generated output, not untrusted
      # input, so there's no reason to add parser attack surface for it.
      - name: Verify coverage report was generated
        run: test -s coverage.xml

      - name: Validator self-test (valid fixtures must pass, invalid must fail)
        run: python scripts/validate.py --self-test --allow-empty

      - name: Validate investigations
        # --allow-empty is TEMPORARY: no investigations exist yet in pre-alpha.
        # Remove it when the first investigation package lands so that CI
        # fails loudly if investigation data ever silently disappears.
        run: python scripts/validate.py --allow-empty --verbose
