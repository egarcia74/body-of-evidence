title: "The FBI and CIA conducted warrantless domestic surveillance programs for over two decades"

statement: >
  The Church Committee documented that the FBI and CIA operated multiple
  warrantless domestic surveillance programs — including mail opening, physical
  surveillance, and informant infiltration — targeting American citizens from the
  early 1950s through the mid-1970s. These programs were conducted without
  statutory authority or judicial oversight, and their existence was not disclosed
  to the public or Congress until the Committee's investigation.

