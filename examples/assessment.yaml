# Example: Assessment entity
# An assessment records THREE separate dimensions:
#   conclusion       — which way the evidence points
#   confidence       — how strong the evidence is
#   dispute_status   — whether a formal challenge is active
# These are deliberately never conflated.
# See schema/assessment.schema.json for the full schema.

id: "boe:assessment:01HV8QKJZ9XTMK3P2R7N5W6D4J"
version_id: "01HVV000000000000000000005"          # Immutable per-version ID; the entity id above is stable across versions
type: "assessment"
claim_id: "boe:claim:01HV8QKJZ9XTMK3P2R7N5W6D4F"
status: "published"

conclusion: "supported"                     # supported | contradicted | mixed | insufficient | not_assessed
confidence_level: 5                         # 1=speculative | 2=weak | 3=moderate | 4=strong | 5=near_certain
confidence_label: "near_certain"            # Must pair with the numeric level
dispute_status: "undisputed"                # undisputed | disputed | unresolved

# Rationale is mandatory and must be substantive
rationale: >
  The claim is supported by the Church Committee's own published report — a
  primary source produced by a committee with subpoena power and access to
  classified records. The report specifically states that the FBI participated
  in the HTLINGUAL mail-opening program from 1958 to 1973 and received nearly
  2,300 items. This primary source is unambiguous, publicly available, and has
  not been credibly disputed in the intervening 50 years. No contradictory
  primary source has been identified. The program's existence was confirmed by
  both the CIA and FBI in their testimony to the Committee. The 1953 start date
  in the claim refers to the CIA program overall; FBI participation beginning in
  1958 is accurately reflected in the evidence.

# The ClaimEvidenceLink entities considered. Links carry polarity, so this
# list captures supporting AND contradicting evidence — omitting known
# contradicting links makes an assessment methodologically invalid.
link_ids:
  - "boe:claim_evidence_link:01HV8QKJZ9XTMK3P2R7N5W6D4S"

confidence_factors:
  evidence_strength: "strong"               # Direct quotation from a primary source document
  source_quality: "high"                    # Official Senate report with subpoena-backed evidence
  corroboration: "strong"                   # CIA and FBI testimony to the Committee
  completeness: "substantial_gaps"          # Some classified appendices remain unreleased
  alternative_explanations: "none_credible"
  context_integrity: "full_context"

what_would_change_assessment: >
  Declassification of contradictory records showing the Committee's report
  was inaccurate would lower confidence. No such records are known to exist.

methodology_version: "0.2.0"

assessor:
  identifier: "github-username"
  role: "lead_investigator"
  conflict_of_interest: "none"

created_at: "2026-08-04T00:00:00Z"
updated_at: "2026-08-04T00:00:00Z"
