# Example: Package Manifest
# Lives at investigations/<slug>/package.yaml
#
# The manifest is the single source of truth for WHICH entity versions are
# current. Supersession = an old version_id no longer being listed here.
# Old entity files are NEVER edited — not even their status field.
# Consumers must resolve current state from this manifest, never from
# filenames or Git timestamps.
# See schema/package.schema.json for the full schema.

